app = "httpbingo"
primary_region = "dfw"
kill_signal = "SIGINT"
kill_timeout = "5s"

[deploy]
  strategy = "rolling"

[env]
  PORT = "8080"

  # ==========================================================================
  # opentelemetry configuration
  # https://opentelemetry.io/docs/languages/sdk-configuration/
  # ==========================================================================
  OTEL_SERVICE_NAME = "httpbingo"
  OTEL_EXPORTER_OTLP_PROTOCOL = "grpc"
  OTEL_EXPORTER_OTLP_ENDPOINT = "https://api.honeycomb.io:443"
  OTEL_EXPORTER_OTLP_COMPRESSION = "gzip"

  # set via fly app secrets
  # OTEL_EXPORTER_OTLP_HEADERS         = "x-honeycomb-team=<key>"
  # OTEL_EXPORTER_OTLP_METRICS_HEADERS = "x-honeycomb-team=<key>,x-honeycomb-dataset=metrics"

  # set at deploy time (see `make deploy`)
  # OTEL_RESOURCE_ATTRIBUTES = "service.version=$(git rev-parse ...)"


[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests" # https://www.fly.io/docs/apps/concurrency/#connections-or-requests
    soft_limit = 100
    hard_limit = 150

  [[services.tcp_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "1s"
    restart_limit = 0
